spring.application.name=medisynth

# Optional local .env file (KEY=VALUE lines, git-ignored). Real environment variables always work too.
spring.config.import=optional:file:.env[.properties]

# ---- PostgreSQL (DB_PASSWORD and JWT_SECRET have NO default: the app refuses to start without them) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medisynth}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# Flyway owns the schema; Hibernate only validates it. No automatic table changes or deletes.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# ---- JWT ----
# Base64 string that decodes to at least 32 random bytes. Generate with: openssl rand -base64 48
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
jwt.issuer=medisynth

# ---- Security ----
app.security.bcrypt-strength=${BCRYPT_STRENGTH:12}
# Comma-separated list of exact origins. Wildcards are rejected at startup.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
# First-admin bootstrap secret. Leave EMPTY to keep the bootstrap endpoint disabled. Must be >= 32 chars if set.
app.admin-bootstrap.secret=${ADMIN_BOOTSTRAP_SECRET:}

# ---- Rate limiting (in-memory, per client address, single instance) ----
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.login.max=10
app.rate-limit.login.window-seconds=60
app.rate-limit.register.max=10
app.rate-limit.register.window-seconds=3600
app.rate-limit.status.max=30
app.rate-limit.status.window-seconds=60
app.rate-limit.bootstrap.max=5
app.rate-limit.bootstrap.window-seconds=900

# ---- Safe error output ----
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
