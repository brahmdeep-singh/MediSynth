# Integration tests need a REAL PostgreSQL database (a separate one: tests wipe its tables!).
# Create it once:  createdb medisynth_test   (or use docker-compose.yml, which creates it for you)
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/medisynth_test}
spring.datasource.username=${TEST_DB_USERNAME:${DB_USERNAME:postgres}}
spring.datasource.password=${TEST_DB_PASSWORD:${DB_PASSWORD}}

# Fast hashing and no throttling for tests (the rate-limit test switches it back on for its own context).
app.security.bcrypt-strength=4
app.rate-limit.enabled=false
spring.flyway.clean-disabled=true
# jwt.secret and app.admin-bootstrap.secret are generated randomly per test run (AbstractIntegrationTest).
